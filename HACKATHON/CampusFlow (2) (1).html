<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>CampusFlow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:#F5F7FC;color:#172033;font-family:Manrope,system-ui,sans-serif}
.card{background:#fff;border:1px solid #E7ECF3;border-radius:14px;box-shadow:0 1px 2px rgba(20,33,61,.04)}
.in{width:100%;border:1px solid #E7ECF3;border-radius:10px;padding:8px 12px;font-size:14px;background:#fff}
.btn{background:#356DF3;color:#fff;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;transition:.15s}.btn:hover{background:#2757d1}
.btn2{border:1px solid #E7ECF3;background:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600}.btn2:hover{background:#F5F7FC}
.nav{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:#a9b6d3;font-size:14px;font-weight:600;width:100%;text-align:left;transition:.15s}
.nav:hover{background:#14213D;color:#fff}.nav.on{background:#356DF3;color:#fff}
.fade{animation:f .3s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
th{text-align:left;font-size:12px;color:#718096;font-weight:600;padding:10px 14px}td{padding:11px 14px;font-size:14px;border-top:1px solid #E7ECF3}
tr.r:hover{background:#F5F7FC;cursor:pointer}.card table td,.card table th{white-space:nowrap}td:nth-child(2){white-space:normal!important;min-width:200px}</style></head><body>
<div id="app" class="flex min-h-screen"></div>
<script>
const S=['Pending','Assigned','In Progress','On Hold','Resolved','Rejected','Reopened'],P=['Low','Medium','High','Critical'];
const SC={Pending:'#EBAA38',Assigned:'#356DF3','In Progress':'#13B8A6','On Hold':'#718096',Resolved:'#16A36A',Rejected:'#B76E79',Reopened:'#8B5CF6'};
const PC={Low:'#718096',Medium:'#356DF3',High:'#EBAA38',Critical:'#E05252'};
const B=['Block K','Block H','Library','Main Admin','Cafeteria','Laboratories','Hostel','Sports Complex','Parking'];
const CAT={'IT Support':'IT & Networking','Electrical':'Engineering & Maintenance','Housekeeping':'Housekeeping','Transportation':'Transportation','Classroom Maintenance':'Engineering & Maintenance','Academic Support':'Academic Administration'};
const SLA={Low:72,Medium:48,High:24,Critical:8};
const USERS=[{name:'Ananya Sharma',email:'ananya@student.edu',role:'student',dept:'B.Tech IT'},{name:'Rahul Verma',email:'rahul.staff@campus.edu',role:'staff',dept:'IT & Networking'},{name:'Priya Nair',email:'priya.admin@campus.edu',role:'admin',dept:'Campus Administration'},{name:'Dr. Meera Iyer',email:'meera.mgmt@campus.edu',role:'management',dept:'University Management'}];
let USER=null;try{USER=JSON.parse(localStorage.getItem('cfu'))}catch(e){}
let ME=USER?USER.name:'';
const NAV={student:[['home','Overview'],['mine','My Requests'],['create','Create Request'],['map','Campus Map'],['notifs','Notifications']],
staff:[['home','Overview'],['all','Assigned Requests'],['map','Campus Map'],['notifs','Notifications']],
admin:[['home','Overview'],['all','All Requests'],['assign','Staff Assignments'],['map','Campus Map'],['stats','Analytics'],['notifs','Notifications']],
management:[['home','Overview'],['stats','Analytics'],['map','Campus Map'],['all','All Requests'],['notifs','Notifications']]};
function seed(){const T=[['Wi-Fi unavailable in computer laboratory','IT Support','Laboratories','High'],['Projector not functioning in Block H','Classroom Maintenance','Block H','Medium'],['Water leakage in hostel washroom','Housekeeping','Hostel','High'],['Broken classroom furniture','Classroom Maintenance','Block K','Low'],['Power socket sparking in Block K','Electrical','Block K','Critical'],['Library air conditioning malfunction','Electrical','Library','Medium'],['Cafeteria cleaning request','Housekeeping','Cafeteria','Medium'],['College bus 7 delayed every morning','Transportation','Parking','Medium'],['Lab system not booting','IT Support','Laboratories','Medium'],['Drinking water dispenser not working','Housekeeping','Hostel','High'],['Damaged laboratory equipment','Academic Support','Laboratories','Low'],['Corridor lighting malfunction','Electrical','Block H','Medium'],['Security access card failing at main gate','Academic Support','Main Admin','High'],['Classroom whiteboard replacement','Classroom Maintenance','Block K','Low']];const T0=[['Wi-Fi down in lab corridor','IT Support','Laboratories'],['Projector not working','Classroom Maintenance','Block K'],['Tube light flickering','Electrical','Block H'],['Bus 7 running late daily','Transportation','Parking'],['Washrooms need cleaning','Housekeeping','Hostel'],['Library AC not cooling','Electrical','Library'],['Timetable portal error','Academic Support','Main Admin'],['Broken bench in canteen','Classroom Maintenance','Cafeteria'],['Power socket sparking','Electrical','Block K'],['Lab PC not booting','IT Support','Laboratories'],['Court floodlight out','Electrical','Sports Complex'],['Dustbins overflowing','Housekeeping','Block H']];
const names=['Ananya Sharma','Aarav Mehta','Meera Reddy','Karthik Rao'],st=['Rahul Verma','Anita Rao','Suresh Babu','Lakshmi Devi'];
const reqs=[...Array(14)].map((_,i)=>{const t=T[i],s=S[(i*3+1)%7==5?4:(i*3+1)%7],pr=t[3];return{id:''+(1040+i*4),title:t[0],cat:t[1],bld:t[2],floor:i%4,room:'R'+(100+i),pr,s,dept:CAT[t[1]],by:names[i%4],staff:s=='Pending'?'':st[i%4],ago:i*9+2,desc:'Reported issue affecting '+(i%5+1)*3+' people. Please investigate.',people:(i%5+1)*3,
log:[{t:'Request submitted',w:names[i%4],h:i*9+2},...(s=='Pending'?[]:[{t:'Status: '+s,w:st[i%4],h:i*9}])],com:[]}});
return{reqs,staff:st.map((n,i)=>({n,dept:Object.values(CAT)[i],av:i!=3})),notifs:[{id:1,t:'SLA warning',m:'1044 is close to its SLA deadline',r:0},{id:2,t:'Request assigned',m:'1040 assigned to Rahul Verma',r:0},{id:3,t:'Request resolved',m:'1048 was marked resolved',r:1}]}}
let DB;try{DB=JSON.parse(localStorage.getItem('cf2'))}catch(e){}DB=DB||seed();
let st={page:'home',id:null,role:USER?USER.role:'student',fc:'',fl:'',q:'',fs:'',fp:'',sort:'new',pg:0,b:null};
const save=()=>{try{localStorage.setItem('cf2',JSON.stringify(DB))}catch(e){}};
// service layer (swap for REST later)
const api={getRequests:()=>DB.reqs,getStaff:()=>DB.staff,getNotifications:()=>DB.notifs,
createRequest(r){const q={...r,id:''+(Math.max(...DB.reqs.map(x=>+x.id))+1),s:'Pending',dept:CAT[r.cat],by:ME,staff:'',ago:0,log:[{t:'Request submitted',w:ME,h:0}],com:[]};DB.reqs.unshift(q);DB.notifs.unshift({id:Date.now(),t:'Request submitted',m:q.id+' submitted',r:0});save();return q},
updateRequest(id,s,who){const q=DB.reqs.find(x=>x.id==id);q.s=s;q.log.push({t:'Status: '+s,w:who,h:0});DB.notifs.unshift({id:Date.now(),t:s=='Resolved'?'Request resolved':'Status updated',m:id+' → '+s,r:0});save()},
assignRequest(id,n){const q=DB.reqs.find(x=>x.id==id);q.staff=n;if(q.s=='Pending')q.s='Assigned';q.log.push({t:'Assigned to '+n,w:'Admin',h:0});DB.notifs.unshift({id:Date.now(),t:'Request assigned',m:id+' assigned to '+n,r:0});save()},
getAnalytics(){const r=DB.reqs,open=r.filter(x=>!['Resolved','Rejected'].includes(x.s)),res=r.filter(x=>x.s=='Resolved'),od=open.filter(x=>x.ago>SLA[x.pr]);
return{total:r.length,open:open.length,pending:r.filter(x=>x.s=='Pending').length,resolved:res.length,overdue:od.length,rate:Math.round(res.length/r.length*100),byCat:Object.keys(CAT).map(c=>[c,r.filter(x=>x.cat==c).length]),byPr:P.map(p=>[p,r.filter(x=>x.pr==p).length]),byS:S.map(s=>[s,r.filter(x=>x.s==s).length]),byDept:[...new Set(Object.values(CAT))].map(d=>{const a=r.filter(x=>x.dept==d);return[d,a.length?Math.round(a.filter(x=>x.s=='Resolved').length/a.length*100):0]})}}};
const $=s=>document.querySelector(s),bd=(t,c)=>`<span style="background:${c}1f;color:${c}" class="px-2 py-0.5 rounded-md text-xs font-bold whitespace-nowrap">${t}</span>`;
const go=(p,id)=>{st.page=p;st.id=id||null;st.pg=0;render()};
const logo=`<svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#356DF3"/><path d="M8 22V12l8-4 8 4v10" stroke="#fff" stroke-width="2" fill="none"/><circle cx="16" cy="15" r="2.5" fill="#13B8A6"/><circle cx="10" cy="22" r="1.8" fill="#fff"/><circle cx="22" cy="22" r="1.8" fill="#fff"/><path d="M16 17.5L10 22M16 17.5L22 22" stroke="#fff"/></svg>`;
const scope=()=>{let r=api.getRequests();if(st.role=='student')r=r.filter(x=>x.by==ME);if(st.role=='staff')r=r.filter(x=>x.staff==ME);return r};
function kpi(l,v,c){return`<div class="card p-4 fade"><div class="text-xs font-semibold text-[#718096]">${l}</div><div class="text-2xl font-extrabold mt-1" style="color:${c||'#172033'}">${v}</div></div>`}
function bars(a,col){const m=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class="mb-2"><div class="flex justify-between text-xs mb-1"><span>${x[0]}</span><b>${x[1]}${col=='%'?'%':''}</b></div><div class="h-2 rounded bg-[#E7ECF3]"><div class="h-2 rounded" style="width:${x[1]/(col=='%'?100:m)*100}%;background:${SC[x[0]]||PC[x[0]]||'#356DF3'}"></div></div></div>`).join('')}
function donut(a){const t=a.reduce((s,x)=>s+x[1],0),cl=['#356DF3','#13B8A6','#EBAA38','#E05252','#718096','#16A36A'];let p=0;const g=a.map((x,i)=>{const s=p;p+=x[1]/t*100;return`${cl[i]} ${s}% ${p}%`}).join(',');
return`<div class="flex items-center gap-5"><div style="width:120px;height:120px;border-radius:50%;background:conic-gradient(${g});-webkit-mask:radial-gradient(circle 36px,transparent 98%,#000);mask:radial-gradient(circle 36px,transparent 98%,#000)"></div><div class="text-xs space-y-1">${a.map((x,i)=>`<div><span style="background:${cl[i]}" class="inline-block w-2 h-2 rounded-sm mr-1.5"></span>${x[0]} · <b>${x[1]}</b></div>`).join('')}</div></div>`}
function table(rows){return`<div class="card overflow-x-auto"><table class="w-full"><thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Location</th><th>Priority</th><th>Dept</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr class="r" onclick="go('detail','${r.id}')"><td class="font-bold">${r.id}</td><td>${r.title}</td><td>${r.cat}</td><td>${r.bld}, F${r.floor}</td><td>${bd(r.pr,PC[r.pr])}</td><td>${r.dept}</td><td>${bd(r.s,SC[r.s])}</td><td class="whitespace-nowrap"><button class="btn2" onclick="event.stopPropagation();go('detail','${r.id}')">View</button>${(st.role=='staff'||st.role=='admin')&&r.s!='Resolved'?` <button class="btn2" onclick="event.stopPropagation();api.updateRequest('${r.id}','Resolved',ME);render()">Resolve</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8 class="text-center py-10 text-[#718096]">No requests match your filters.</td></tr>'}</tbody></table></div>`}
function home(){const a=api.getAnalytics(),r=scope(),R=st.role,c=s=>r.filter(x=>x.s==s).length;
const head=R=='student'?['Good morning, '+ME.split(' ')[0]+'!',"Here's what's happening with your campus service requests."]:R=='staff'?['Good morning, '+ME.split(' ')[0]+'!','Your assigned work, SLA deadlines and recent updates.']:R=='admin'?['Campus Operations Overview','Welcome back, '+ME+' · live control center across all departments.']:['Executive Summary','Welcome, '+ME+' · campus-wide service performance at a glance.'];
const k=R=='student'?[['Total Requests',r.length],['Pending',c('Pending'),'#EBAA38'],['In Progress',c('In Progress'),'#13B8A6'],['Resolved',c('Resolved'),'#16A36A']]:R=='staff'?[['Assigned to Me',r.length],['In Progress',c('In Progress'),'#13B8A6'],['Overdue',r.filter(x=>x.ago>SLA[x.pr]&&x.s!='Resolved').length,'#E05252'],['Completed',c('Resolved'),'#16A36A']]:[['Total Requests',a.total],['Open',a.open],['Pending Assignments',a.pending,'#EBAA38'],['Resolved',a.resolved,'#16A36A'],['Overdue',a.overdue,'#E05252'],['Resolution Rate',a.rate+'%','#356DF3']];
const crit=r.filter(x=>x.pr=='Critical'&&x.s!='Resolved').slice(0,3);
return`<div class="fade"><div class="flex flex-wrap justify-between items-end gap-3 mb-5"><div><h1 class="text-2xl font-extrabold">${head[0]}</h1><p class="text-sm text-[#718096]">${head[1]}</p></div>${R=='student'?'<button class="btn" onclick="go(\'create\')">+ Create New Request</button>':''}</div>
<div class="grid grid-cols-2 lg:grid-cols-${k.length>4?6:4} gap-3 mb-5">${k.map(x=>kpi(...x)).join('')}</div>
<div class="grid lg:grid-cols-3 gap-4 mb-5"><div class="card p-4"><h3 class="font-bold mb-3 text-sm">Request status</h3>${bars(S.map(s=>[s,r.filter(x=>x.s==s).length]))}</div>
<div class="card p-4"><h3 class="font-bold mb-3 text-sm">By category</h3>${donut(R=='student'||R=='staff'?Object.keys(CAT).map(c=>[c,r.filter(x=>x.cat==c).length]):a.byCat)}</div>
<div class="card p-4"><h3 class="font-bold mb-3 text-sm">${R=='admin'||R=='management'?'Department resolution rate':'Critical alerts'}</h3>${R=='admin'||R=='management'?bars(a.byDept,'%'):(crit.map(x=>`<div class="text-sm py-1.5 cursor-pointer" onclick="go('detail','${x.id}')">${bd('Critical','#E05252')} ${x.title}</div>`).join('')||'<p class="text-sm text-[#718096]">No critical issues. 🎉</p>'.replace(' 🎉',''))}</div></div>
<h3 class="font-bold mb-2">Recent requests</h3>${table(r.slice(0,6))}</div>`}
function listPage(){const m=st.page=='mine';return`<div class="fade"><h1 class="text-2xl font-extrabold mb-4">${m?'My Requests':NAV[st.role].find(n=>n[0]=='all')[1]}</h1>
<div class="flex flex-wrap gap-2 mb-3"><input class="in" style="max-width:240px" placeholder="Search requests…" value="${st.q}" oninput="st.q=this.value;st.pg=0;list()">
<select class="in" style="width:auto" onchange="st.fs=this.value;st.pg=0;list()"><option value="">All statuses</option>${S.map(s=>`<option ${st.fs==s?'selected':''}>${s}</option>`).join('')}</select>
<select class="in" style="width:auto" onchange="st.fp=this.value;st.pg=0;list()"><option value="">All priorities</option>${P.map(s=>`<option ${st.fp==s?'selected':''}>${s}</option>`).join('')}</select>
<select class="in" style="width:auto" onchange="st.fc=this.value;st.pg=0;list()"><option value="">All categories</option>${Object.keys(CAT).map(s=>`<option ${st.fc==s?'selected':''}>${s}</option>`).join('')}</select><select class="in" style="width:auto" onchange="st.fl=this.value;st.pg=0;list()"><option value="">All locations</option>${B.map(s=>`<option ${st.fl==s?'selected':''}>${s}</option>`).join('')}</select><select class="in" style="width:auto" onchange="st.sort=this.value;list()"><option value="new">Newest first</option><option value="pr">Priority</option><option value="old">Oldest first</option></select></div><div id="list"></div></div>`}
function list(){let r=scope().filter(x=>(!st.q||(x.title+x.id+x.cat).toLowerCase().includes(st.q.toLowerCase()))&&(!st.fs||x.s==st.fs)&&(!st.fp||x.pr==st.fp)&&(!st.fc||x.cat==st.fc)&&(!st.fl||x.bld==st.fl));
r.sort((a,b)=>st.sort=='pr'?P.indexOf(b.pr)-P.indexOf(a.pr):st.sort=='old'?b.ago-a.ago:a.ago-b.ago);const n=Math.ceil(r.length/8)||1;
$('#list').innerHTML=table(r.slice(st.pg*8,st.pg*8+8))+`<div class="flex justify-between items-center mt-3 text-sm"><span class="text-[#718096]">${r.length} requests</span><div class="flex gap-2 items-center"><button class="btn2" ${st.pg<1?'disabled':''} onclick="st.pg--;list()">Prev</button>${st.pg+1}/${n}<button class="btn2" ${st.pg>=n-1?'disabled':''} onclick="st.pg++;list()">Next</button></div></div>`}
function create(){return`<div class="fade grid lg:grid-cols-3 gap-5"><div class="lg:col-span-2"><h1 class="text-2xl font-extrabold mb-4">Create Service Request</h1><div id="ok"></div><p class="text-sm text-[#718096] mb-3">Submitting as <b>${ME}</b> · ${USER.dept}</p><div class="card p-5 space-y-3" id="fm">
<div><label class="text-xs font-bold">Title</label><input id="t" class="in" placeholder="e.g. Projector not working in Block K 204"></div>
<div><label class="text-xs font-bold">Description</label><textarea id="d" rows="3" class="in" placeholder="Describe the issue in detail"></textarea></div>
<div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-bold">Category</label><select id="c" class="in" onchange="smart()">${Object.keys(CAT).map(c=>`<option>${c}</option>`).join('')}</select></div>
<div><label class="text-xs font-bold">Priority</label><select id="p" class="in" onchange="smart()">${P.map(p=>`<option ${p=='Medium'?'selected':''}>${p}</option>`).join('')}</select></div>
<div><label class="text-xs font-bold">Building</label><select id="b" class="in">${B.map(b=>`<option>${b}</option>`).join('')}</select></div>
<div><label class="text-xs font-bold">Floor / Room</label><div class="flex gap-2"><input id="f" type="number" min="0" value="1" class="in"><input id="rm" class="in" placeholder="Room"></div></div>
<div><label class="text-xs font-bold">People affected</label><input id="n" type="number" min="1" value="1" class="in"></div></div>
<div class="rounded-xl p-3 text-sm" style="background:#356DF31a" id="sm"></div>
<button class="btn" onclick="submitReq()">Submit Service Request</button></div></div>
<div class="card p-5 h-fit"><h3 class="font-bold mb-3">How it works</h3>${['Submit your request','Department reviews & assigns','Staff works on it','You confirm resolution'].map((s,i)=>`<div class="flex gap-3 mb-3 text-sm"><span class="w-6 h-6 rounded-full bg-[#356DF3] text-white text-xs grid place-items-center font-bold shrink-0">${i+1}</span>${s}</div>`).join('')}</div></div>`}
function smart(){const c=$('#c').value,p=$('#p').value;$('#sm').innerHTML=`<b>Smart assistance:</b> routed to <b>${CAT[c]}</b> · target resolution within <b>${SLA[p]} hours</b>`}
function submitReq(){const t=$('#t').value.trim(),d=$('#d').value.trim();if(t.length<5||d.length<10){$('#ok').innerHTML='<div class="mb-3 p-3 rounded-lg text-sm" style="background:#E052521a;color:#E05252">Please enter a title (5+ chars) and a description (10+ chars).</div>';return}
const q=api.createRequest({title:t,desc:d,cat:$('#c').value,pr:$('#p').value,bld:$('#b').value,floor:$('#f').value,room:$('#rm').value||'—',people:$('#n').value});
$('#fm').parentElement.innerHTML=`<div class="card p-8 text-center fade"><div class="text-3xl font-extrabold text-[#16A36A]">✓</div><h2 class="text-xl font-extrabold mt-2">Request submitted</h2><p class="text-sm text-[#718096] my-2">Your request ID is <b>${q.id}</b>. Routed to ${q.dept}.</p><button class="btn" onclick="go('detail','${q.id}')">View request</button> <button class="btn2" onclick="go('mine')">My Requests</button></div>`}
function detail(){const q=DB.reqs.find(x=>x.id==st.id);if(!q)return'<p>Not found</p>';const steps=['Submitted','Reviewed','Assigned','In Progress','Resolved'],cur=q.s=='Pending'?1:q.s=='Assigned'?3:q.s=='Resolved'?5:q.s=='Rejected'?1:4,can=st.role=='staff'||st.role=='admin',left=SLA[q.pr]-q.ago;
return`<div class="fade"><button class="btn2 mb-3" onclick="history.back?go('${st.role=='student'?'mine':'all'}'):0">← Back</button><div class="flex flex-wrap justify-between gap-2 mb-4"><div><div class="text-xs font-bold text-[#718096]">${q.id}</div><h1 class="text-2xl font-extrabold">${q.title}</h1></div><div class="flex gap-2 items-start">${bd(q.pr,PC[q.pr])}${bd(q.s,SC[q.s])}</div></div>
<div class="card p-4 mb-4 flex justify-between">${steps.map((s,i)=>`<div class="text-center flex-1 text-xs font-semibold" style="color:${i<cur?'#356DF3':'#718096'}"><div class="w-7 h-7 mx-auto rounded-full grid place-items-center mb-1 text-white" style="background:${i<cur?'#356DF3':'#E7ECF3'}">${i<cur?'✓':i+1}</div>${s}</div>`).join('')}</div>
<div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 space-y-4"><div class="card p-4"><p class="text-sm mb-3">${q.desc}</p><div class="grid grid-cols-2 gap-2 text-sm text-[#718096]"><div>Category: <b class="text-[#172033]">${q.cat}</b></div><div>Location: <b class="text-[#172033]">${q.bld}, F${q.floor}, ${q.room}</b></div><div>Submitted by: <b class="text-[#172033]">${q.by}</b></div><div>Department: <b class="text-[#172033]">${q.dept}</b></div><div>Assigned staff: <b class="text-[#172033]">${q.staff||'Unassigned'}</b></div><div>Submitted: <b class="text-[#172033]">${q.ago?q.ago+'h ago':'just now'}</b></div><div>Resolution deadline: <b class="text-[#172033]">${SLA[q.pr]}h from submission</b></div><div>SLA: <b style="color:${left<0?'#E05252':'#16A36A'}">${q.s=='Resolved'?'Met':left<0?-left+'h overdue':left+'h remaining'}</b></div></div></div>
${can?`<div class="card p-4"><h3 class="font-bold text-sm mb-2">Update status</h3><div class="flex flex-wrap gap-2">${['In Progress','On Hold','Resolved','Rejected'].map(s=>`<button class="btn2" onclick="if(confirm('Change status to ${s}?')){api.updateRequest('${q.id}','${s}','${st.role=='admin'?'Admin':q.staff||'Staff'}');render()}">${s=='In Progress'?'Start Work':s=='Resolved'?'Mark as Resolved':s=='On Hold'?'Put On Hold':'Reject'}</button>`).join('')}</div></div>`:q.s=='Resolved'&&st.role=='student'?`<div class="card p-4"><button class="btn2" onclick="api.updateRequest('${q.id}','Reopened','${ME}');render()">Reopen request</button></div>`:''}
<div class="card p-4"><h3 class="font-bold text-sm mb-2">Comments</h3>${q.com.map(c=>`<div class="text-sm py-1.5 border-b border-[#E7ECF3]"><b>${c.w}</b> ${c.t}</div>`).join('')||'<p class="text-sm text-[#718096]">No comments yet.</p>'}<div class="flex gap-2 mt-3"><input id="cm" class="in" placeholder="Add a comment…"><button class="btn" onclick="addC('${q.id}')">Post</button></div></div></div>
<div class="card p-4 h-fit"><h3 class="font-bold text-sm mb-3">Activity timeline</h3>${[...q.log].reverse().map(l=>`<div class="border-l-2 border-[#356DF3] pl-3 pb-3 text-sm"><b>${l.t}</b><div class="text-xs text-[#718096]">${l.w} · ${l.h?l.h+'h ago':'just now'}</div></div>`).join('')}</div></div></div>`}
function addC(id){const v=$('#cm').value.trim();if(!v)return;DB.reqs.find(x=>x.id==id).com.push({w:st.role=='student'?ME:'Staff',t:v});save();render()}
function assign(){const a=api.getRequests(),n=s=>a.filter(x=>x.staff==s&&!['Resolved','Rejected'].includes(x.s)).length;
return`<div class="fade"><h1 class="text-2xl font-extrabold mb-4">Staff Assignments</h1><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-5">${api.getStaff().map(s=>{const c=n(s.n),w=Math.min(100,c*12),l=w<35?['Low','#16A36A']:w<70?['Moderate','#EBAA38']:['High','#E05252'];return`<div class="card p-4"><div class="font-bold">${s.n}</div><div class="text-xs text-[#718096] mb-2">${s.dept}</div><div class="h-2 rounded bg-[#E7ECF3] mb-2"><div class="h-2 rounded" style="width:${w}%;background:${l[1]}"></div></div><div class="flex justify-between text-xs">${bd(l[0]+' workload',l[1])}<span>${c} active</span></div></div>`}).join('')}</div>
<h3 class="font-bold mb-2">Assign or reassign</h3><div class="card overflow-x-auto"><table class="w-full"><thead><tr><th>ID</th><th>Title</th><th>Dept</th><th>Status</th><th>Staff</th></tr></thead><tbody>${a.filter(x=>!['Resolved','Rejected'].includes(x.s)).slice(0,12).map(x=>`<tr><td class="font-bold">${x.id}</td><td>${x.title}</td><td>${x.dept}</td><td>${bd(x.s,SC[x.s])}</td><td><select class="in" style="width:150px" onchange="api.assignRequest('${x.id}',this.value);render()"><option value="">Unassigned</option>${api.getStaff().map(s=>`<option ${x.staff==s.n?'selected':''}>${s.n}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}
function map(){const a=api.getRequests(),pos=[[40,40],[210,40],[380,40],[40,170],[210,170],[380,170],[40,300],[210,300],[380,300]];const cnt=b=>a.filter(x=>x.bld==b&&!['Resolved','Rejected'].includes(x.s)).length;
const col=n=>n>=3?'#E05252':n>=2?'#EBAA38':n>=1?'#356DF3':'#13B8A6';const sel=st.b;
let side='<p class="text-sm text-[#718096]">Select a building on the map.</p>';if(sel){const r=a.filter(x=>x.bld==sel),cc={};r.forEach(x=>cc[x.cat]=(cc[x.cat]||0)+1);const top=Object.entries(cc).sort((x,y)=>y[1]-x[1])[0];
side=`<h3 class="font-extrabold text-lg">${sel}</h3><div class="grid grid-cols-3 gap-2 my-3">${kpi('Active',cnt(sel))}${kpi('Pending',r.filter(x=>x.s=='Pending').length)}${kpi('Resolved',r.filter(x=>x.s=='Resolved').length)}</div><div class="text-sm mb-3">Most common: <b>${top?top[0]:'—'}</b></div>${r.slice(0,5).map(x=>`<div class="text-sm py-1.5 border-t border-[#E7ECF3] cursor-pointer" onclick="go('detail','${x.id}')">${x.id} ${x.title} ${bd(x.s,SC[x.s])}</div>`).join('')}`}
return`<div class="fade"><h1 class="text-2xl font-extrabold mb-4">Campus Map <span class="text-sm font-semibold text-[#13B8A6]">● Live digital twin</span></h1><div class="grid lg:grid-cols-3 gap-4"><div class="card p-3 lg:col-span-2" style="background:#0B1730"><svg viewBox="0 0 560 440" class="w-full"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1d2b4d"/></pattern></defs><rect width="560" height="440" fill="url(#g)"/><path d="M0 150H560M0 280H560M190 0V440M360 0V440" stroke="#26365e" stroke-width="10" opacity=".6"/>
${B.map((b,i)=>{const [x,y]=pos[i],n=cnt(b);return`<g style="cursor:pointer" onclick="st.b='${b}';render()"><rect x="${x}" y="${y}" width="140" height="90" rx="10" fill="${col(n)}" fill-opacity=".25" stroke="${col(n)}" stroke-width="${sel==b?4:1.5}"/><text x="${x+70}" y="${y+42}" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">${b}</text><text x="${x+70}" y="${y+64}" text-anchor="middle" fill="${col(n)}" font-size="12">${n} active</text></g>`}).join('')}</svg>
<div class="flex gap-4 text-xs text-white p-2">${[['#13B8A6','None'],['#356DF3','Low'],['#EBAA38','Medium'],['#E05252','High']].map(l=>`<span><span style="background:${l[0]}" class="inline-block w-2 h-2 rounded-sm mr-1"></span>${l[1]}</span>`).join('')}</div></div><div class="card p-4">${side}</div></div></div>`}
function stats(){const a=api.getAnalytics();return`<div class="fade"><h1 class="text-2xl font-extrabold mb-4">Analytics & Reports</h1><div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5">${kpi('Total Requests',a.total)}${kpi('Resolution Rate',a.rate+'%','#16A36A')}${kpi('Avg Resolution','31h')}${kpi('Satisfaction','4.3/5','#356DF3')}${kpi('Overdue',a.overdue,'#E05252')}</div>
<div class="grid lg:grid-cols-2 gap-4"><div class="card p-4"><h3 class="font-bold text-sm mb-3">Category distribution</h3>${donut(a.byCat)}</div><div class="card p-4"><h3 class="font-bold text-sm mb-3">Priority distribution</h3>${bars(a.byPr)}</div><div class="card p-4"><h3 class="font-bold text-sm mb-3">Department efficiency</h3>${bars(a.byDept,'%')}</div><div class="card p-4"><h3 class="font-bold text-sm mb-3">Status breakdown</h3>${bars(a.byS)}</div></div></div>`}
function notifs(){const n=api.getNotifications();return`<div class="fade max-w-2xl"><div class="flex justify-between mb-4"><h1 class="text-2xl font-extrabold">Notifications</h1><button class="btn2" onclick="DB.notifs.forEach(x=>x.r=1);save();render()">Mark all as read</button></div>${n.map(x=>`<div class="card p-3 mb-2 flex gap-3 items-center cursor-pointer" onclick="DB.notifs.find(y=>y.id==${x.id}).r=1;save();render()"><span class="w-2 h-2 rounded-full" style="background:${x.r?'#E7ECF3':'#356DF3'}"></span><div><div class="text-sm font-bold">${x.t}</div><div class="text-xs text-[#718096]">${x.m}</div></div></div>`).join('')}</div>`}
function render(){if(!USER)return loginPage();const nav=NAV[st.role],un=DB.notifs.filter(x=>!x.r).length,pg=st.page;
const body={home,mine:listPage,all:listPage,create,detail,assign,map,stats,notifs}[pg]();
$('#app').innerHTML=`<aside class="hidden md:flex flex-col w-60 shrink-0 p-4 gap-1" style="background:#0B1730"><div class="flex items-center gap-2 text-white font-extrabold text-lg mb-5 px-1">${logo}CampusFlow</div>${nav.map(n=>`<button class="nav ${pg==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}${n[0]=='notifs'&&un?`<span class="ml-auto bg-[#E05252] text-white text-xs rounded-full px-1.5">${un}</span>`:''}</button>`).join('')}<div class="mt-auto text-xs text-[#a9b6d3] px-1">One Campus. One Platform. Every Issue Accounted For.</div></aside>
<main class="flex-1 min-w-0"><header class="flex flex-wrap items-center gap-3 px-5 py-3 bg-white border-b border-[#E7ECF3]"><div class="md:hidden">${logo}</div><div class="text-sm text-[#718096] hidden sm:block">CampusFlow / <b class="text-[#172033]">${(nav.find(n=>n[0]==pg)||['','Request'])[1]}</b></div><div class="ml-auto flex items-center gap-3"><select class="in" style="width:auto;background:#EBAA381f;font-weight:700" onchange="demoRole(this.value)">${['student','staff','admin','management'].map(r=>`<option value="${r}" ${st.role==r?'selected':''}>DEMO: ${r}</option>`).join('')}</select><button onclick="go('notifs')" class="btn2">🔔 ${un}</button><div class="w-8 h-8 rounded-full bg-[#14213D] text-white grid place-items-center text-xs font-bold">${ini(USER.name)}</div><div class="hidden sm:block leading-tight"><div class="text-sm font-bold">${USER.name}</div><div class="text-xs text-[#718096]">${USER.role} · ${USER.dept}</div></div><button class="btn2" onclick="logout()">Log out</button></div></header>
<div class="md:hidden flex gap-1 overflow-x-auto p-2 bg-[#0B1730]">${nav.map(n=>`<button class="nav ${pg==n[0]?'on':''}" style="width:auto;white-space:nowrap" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</div>
<div class="p-5 max-w-6xl">${body}</div></main>`;if(pg=='mine'||pg=='all')list();if(pg=='create')smart()}
const ini=n=>n.replace('Dr. ','').split(' ').map(w=>w[0]).join('').slice(0,2);
function loginPage(){$('#app').innerHTML=`<div class="m-auto w-full max-w-sm p-6 fade"><div class="flex items-center gap-2 font-extrabold text-xl mb-1">${logo}CampusFlow</div><p class="text-sm text-[#718096] mb-4">One Campus. One Platform. Every Issue Accounted For.</p><div class="card p-5 space-y-3"><div id="le"></div><input id="em" class="in" placeholder="Email"><input id="pw" type="password" class="in" placeholder="Password"><button class="btn w-full" onclick="login($('#em').value,$('#pw').value)">Sign in</button><div class="text-xs text-[#718096]">Demo accounts (password 123456):${USERS.map(u=>`<div class="cursor-pointer py-1 hover:text-[#356DF3]" onclick="login('${u.email}','123456')">${u.name} · ${u.role}</div>`).join('')}</div></div></div>`}
function login(e,p){const u=USERS.find(x=>x.email==e.trim().toLowerCase()&&p=='123456');if(!u){$('#le').innerHTML='<div class="text-sm p-2 rounded-lg" style="background:#E052521a;color:#E05252">Invalid email or password.</div>';return}setUser(u)}
function setUser(u){USER=u;ME=u.name;st.role=u.role;try{localStorage.setItem('cfu',JSON.stringify(u))}catch(e){}go('home')}
function logout(){USER=null;ME='';try{localStorage.removeItem('cfu')}catch(e){}render()}
function demoRole(r){setUser(USERS.find(u=>u.role==r))}
render();
</script></body></html>
